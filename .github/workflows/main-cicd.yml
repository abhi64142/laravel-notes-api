name: Laravel DockerHub CI/CD

on:

  # Auto run when code is pushed to dev
  push:
    branches:
      - dev

  # Validate PRs before merge
  pull_request:
    branches:
      - dev

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:

  # ==================================================
  # BUILD & TEST
  # ==================================================
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------
      # Checkout repository
      # ----------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------
      # Setup PHP
      # ----------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      # ----------------------------------------------
      # Verify PHP Version
      # ----------------------------------------------
      - name: Verify PHP
        run: php -v

      # ----------------------------------------------
      # Install Dependencies
      # ----------------------------------------------
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      # ----------------------------------------------
      # Prepare Laravel Environment
      # ----------------------------------------------
      - name: Setup Laravel
        run: |

          cp .env.example .env

          touch database/database.sqlite

          php artisan key:generate

      # ----------------------------------------------
      # Run Database Migrations
      # SQLite DB used only for CI validation
      # ----------------------------------------------
      - name: Run Migrations
        run: php artisan migrate --force

      # ----------------------------------------------
      # Clear Laravel Cache
      # ----------------------------------------------
      - name: Clear Cache
        run: |

          php artisan config:clear

          php artisan cache:clear

          php artisan route:clear

      # ----------------------------------------------
      # Run Laravel Tests
      # ----------------------------------------------
      - name: Run Tests
        run: php artisan test

  # ==================================================
  # BUILD IMAGE + PUSH TO DOCKER HUB
  # ==================================================
  docker-build-and-push:

    if: github.event_name == 'push'

    needs: build-and-test

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------
      # Checkout Repository
      # ----------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------
      # Login To Docker Hub
      # ----------------------------------------------
      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------
      # Build Docker Image
      # latest      -> deployment tag
      # github.sha  -> rollback tag
      # ----------------------------------------------
      - name: Build Docker Image
        run: |

          docker build \
            -t abhi64142/notes-api:latest \
            -t abhi64142/notes-api:${{ github.sha }} \
            .

      # ----------------------------------------------
      # Push Latest Tag
      # ----------------------------------------------
      - name: Push Latest Image
        run: docker push abhi64142/notes-api:latest

      # ----------------------------------------------
      # Push Rollback Tag
      # ----------------------------------------------
      - name: Push Commit Image
        run: docker push abhi64142/notes-api:${{ github.sha }}

  # ==================================================
  # DEPLOY TO EC2
  # ==================================================
  deploy:

    if: github.event_name == 'push'

    needs: docker-build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy To EC2

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            cd ${{ secrets.EC2_PATH }}

            echo "=================================="
            echo "Pulling latest image..."
            echo "=================================="

            docker pull abhi64142/notes-api:latest

            echo "=================================="
            echo "Stopping old containers..."
            echo "=================================="

            docker compose down

            echo "=================================="
            echo "Starting new containers..."
            echo "=================================="

            docker compose up -d

            echo "=================================="
            echo "Waiting for application..."
            echo "=================================="

            sleep 15

            echo "=================================="
            echo "Running health check..."
            echo "=================================="

            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost)

            echo "HTTP STATUS: $STATUS"

            if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then

              echo "Deployment Failed"

              exit 1

            fi

            echo "=================================="
            echo "Deployment Successful 🚀"
            echo "=================================="
