name: Laravel Production CI/CD

on:
  push:
    branches:
      - dev

  workflow_dispatch:

jobs:

  # ==========================================
  # BUILD & TEST
  # ==========================================
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Laravel
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Clear Cache
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear

  # ==========================================
  # BUILD IMAGE & PUSH TO DOCKER HUB
  # ==========================================
  docker:

    needs: build-and-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build -t abhi64142/notes-api:latest .
          docker tag abhi64142/notes-api:latest abhi64142/notes-api:${{ github.sha }}

      - name: Push Latest
        run: docker push abhi64142/notes-api:latest

      - name: Push Commit Tag
        run: docker push abhi64142/notes-api:${{ github.sha }}

  # ==========================================
  # DEPLOY TO EC2
  # ==========================================
  deploy:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            cd ${{ secrets.EC2_PATH }}

            echo "=================================="
            echo "Pulling latest image..."
            echo "=================================="

            docker pull abhi64142/notes-api:latest

            echo "=================================="
            echo "Restarting containers..."
            echo "=================================="

            docker compose up -d

            echo "=================================="
            echo "Waiting for app..."
            echo "=================================="

            sleep 15

            echo "=================================="
            echo "Running migrations..."
            echo "=================================="

            docker exec notes-api-app php artisan migrate --force

            echo "=================================="
            echo "Optimizing Laravel..."
            echo "=================================="

            docker exec notes-api-app php artisan optimize

            echo "=================================="
            echo "Health Check..."
            echo "=================================="

            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost)

            echo "HTTP STATUS = $STATUS"

            if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
              echo "Deployment Failed"
              exit 1
            fi

            echo "=================================="
            echo "Deployment Successful 🚀"
            echo "=================================="
